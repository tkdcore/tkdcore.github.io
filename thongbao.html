<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - Phần Mềm Đang Phát Triển</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px auto;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .icon-box i {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .status-tag {
            display: inline-block;
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(234, 179, 8, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .redirect-notice {
            background: rgba(51, 65, 85, 0.6);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .countdown {
            color: #3b82f6;
            font-weight: 700;
            font-size: 16px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-gear"></i>
        </div>
        
        <span class="status-tag">Đang Nâng Cấp & Phát Triển</span>
        
        <h1>Tính Năng Đang Hoàn Thiện</h1>
        
        <p>Phần mềm / Tính năng này hiện đang trong quá trình xây dựng. Chúng tôi sẽ sớm ra mắt trong thời gian tới!</p>

        <!-- Thông báo đếm ngược -->
        <div class="redirect-notice">
            <i class="fa-regular fa-clock"></i>
            Tự động về trang chủ sau <span id="timer" class="countdown">5</span> giây...
        </div>

        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> Về trang chủ ngay
        </a>
    </div>

    <script>
        // Thời gian chờ (tính bằng giây)
        let timeLeft = 5;
        
        // Đường dẫn trang chủ của bạn (thay đổi nếu cần)
        const homeUrl = 'index.html';

        const timerElement = document.getElementById('timer');

        const countdownInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = homeUrl;
            }
        }, 1000);
    </script>

</body>
</html>
