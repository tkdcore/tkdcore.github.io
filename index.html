        /* Card container shadow & depth */

        }

        /* Inner border effect */

            border: 2px solid rgba(255, 255, 255, 0.25);
        }

        /* Label banner styling */
        .label-banner {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Khung chứa ảnh (tùy chọn) */

            width: 100%;
            max-width: 800px; /* Độ rộng tối đa khi xem trên PC */
            margin: 0 auto;   /* Căn giữa khung ra giữa màn hình */
            padding: 10px;    /* Khoảng cách đệm tránh sát mép màn hình mobile */
            box-sizing: border-box;
        }

        /* Thuộc tính giúp ảnh tự co giãn linh hoạt */
        .responsive-img {
            max-width: 100%;  /* Không bao giờ tràn quá khung chứa */
            height: auto;     /* Tự động tính chiều cao để giữ nguyên tỉ lệ ảnh */

    <!-- JavaScript Fallback / Link Interception Handler -->
    <script>
        function handleLinkClick(event, url) {
            if (url.startsWith('https://chamdiem') && !url.includes('.app') && !url.includes('.com') && !url.includes('.vn')) {
                event.preventDefault();
                showToast(`Đang mở liên kết: ${url}`);
                setTimeout(() => {
                    window.open(url, '_blank');
                }, 800);
            }
        }

        function showToast(message) {
            let toast = document.getElementById('custom-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'custom-toast';
                toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white border border-slate-700 px-5 py-3 rounded-xl shadow-2xl z-50 text-xs sm:text-sm flex items-center gap-2 transition-all duration-300 opacity-0 transform translate-y-4';
                document.body.appendChild(toast);
            }

            toast.innerHTML = `<i class="fa-solid fa-circle-info text-blue-400"></i> ${message}`;
            
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
            }, 50);

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }
    </script>
